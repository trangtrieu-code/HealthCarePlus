<html lang="en">

    <link rel="stylesheet" href="styles.css">
    <title>No Appointment Found</title>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <img src="img/bonjour-sante.inline.svg" id="inline" alt="BS logo" class="img-fluid" style="max-width: 150px;">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link text-center" href="appointments_for_Pts.html">View Your Appointments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-center" href="search-criteria.html">Book An Appointment</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-center" href="documents.html">View Documents</a>
                    </li>
                </ul>
            </div>
            <!--OPTIONAL: add a Log Out button-->
        </div>
    </nav>


    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="text-center">
            <h1>No Appointment Found</h1><br>
            <p>Please try different search criteria.</p>
            <!-- Links to return to different pages -->
            <div class="mt-4">
                <a href="http://localhost:8000/api/users/patient_profile" class="btn btn-primary me-2">Return to Patient Profile</a>
                <a href="search-criteria.html" class="btn btn-secondary">Return to Search Criteria</a>
            </div>
        </div>

    <!-- Footer -->
    <footer class="mt-5 bg-light py-3 text-center">
        <p>Contact us: info@bonjour-sante.com | +123 456 7890</p>
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script>
        // Get the patient email from sessionStorage
        const patientEmail = sessionStorage.getItem('email');
    //const patientId = sessionStorage.getItem('id');
    // sessionStorage.setItem('patientId', '106');

    if (!patientEmail) {
        console.error("No patient email found in sessionStorage.");
        return;
    }
    // Construct the dynamic link to the patient profile
    const profileUrl = `http://localhost:8000/api/users/patient_profile?email=${patientEmail}`;
        
    // Update the button link
    const returnToProfileBtn = document.getElementById('returnToProfileBtn');
    returnToProfileBtn.href = profileUrl;
</script>

</body>
</html>
