<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login for Existing Patients</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script>
    // Function to display Z-pane message
    function showZPaneMessage(message, isSuccess = true) {
      $("#zPaneMessage").text(message);

      if (isSuccess) {
        $("#zPane").css("background-color", "#28a745"); // Green for success
      } else {
        $("#zPane").css("background-color", "#dc3545"); // Red for error
      }

      $("#zPane").addClass("show").fadeIn();

      setTimeout(function () {
        $("#zPane").removeClass("show").fadeOut();
      }, 2500); // Hide after 2.5 seconds
    }
  </script>
</head>

<body>
  <!-- Z-Pane for Notifications -->
  <div id="zPane" class="z-pane" style="display: none">
    <div id="zPaneMessage" class="z-pane-message"></div>
  </div>

  <!-- Modal -->
<div class="modal fade" id="confirmationModal" tabindex="-1" aria-labelledby="confirmationModalLabel" aria-hidden="true">
  <div class="modal-dialog">
      <div class="modal-content">
          <div class="modal-header">
              <h5 class="modal-title" id="confirmationModalLabel">Registration Successful</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
              Your account has been successfully created. You can now log in.
          </div>
          <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
              <button type="button" class="btn btn-primary" id="redirectToLoginBtn">Go to Login</button>
              <!-- Return to Login Button -->
              <div class="d-grid gap-2 mt-4">
                  <button class="btn btn-primary" type="button" id="backToLoginButton">Return To Login</button>
              </div>
          </div>
      </div>
  </div>
</div>


  <!-- Navigation Bar -->
  <nav class="navbar navbar-light bg-light">
    <img src="img/bonjour-sante.inline.svg" id="inline" alt="medical team of the clinic" class="img-fluid" />
  </nav>

  <!-- Main content section -->
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow-sm">
          <h1 class="text-center mb-4">Login for Existing Patients</h1>

          <!-- Email Input (will be our identifier instead of a username) -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" />
          </div>

          <!-- Password Input -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" />
          </div>

          <!-- Forgot Password Link --> 
          <div class="d-flex justify-content-end mb-3">
            <a href="./password.html" class="text-decoration-none">Forgot your password?</a>
          </div>

          <!-- Login Button -->
          <div class="d-grid gap-2">
            <button class="btn btn-primary" type="button" id="loginButton">
              Log In
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="mt-5 bg-light py-3 text-center">
    <p>Contact us: info@bonjour-sante.com | +123 456 7890</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // log in button
    $("#loginButton").click(function () {
      let email = $("#email").val();
      let password = $("#password").val();

      // debugging
      console.log("Email:", email);
      console.log("Password:", password);

      // Validate input before sending
      if (!email || !password) {
        console.log("Validation failed: Email or Password is missing.");
        showZPaneMessage("Please enter both email and password.", false);
        return;
      }

      console.log("Sending login request...");

      // AJAX request to login
      $.ajax({
        url: "http://localhost:8000/api/users/login",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({
          email: email,
          password: password
        }),

        success: function (data) {
          console.log("Login successful:", data);
          showZPaneMessage("Login successful! Redirecting to your profile.", true);

          // Redirect after a short delay (you can adjust the delay)
          setTimeout(function () {
            // Optionally, store user info in sessionStorage to persist across pages
            sessionStorage.setItem('email', data.user.email);  // Store email in session storage
            sessionStorage.setItem('patientId', data.user.patient_id);  // Store patientId (user_id)

            window.location.href = "patient_profile.html";  // Redirect to patient profile page
          }, 2500);  // 2.5 seconds delay for showing the success message

        },
        error: function (jqXHR, textStatus, errorThrown) {
          console.log("AJAX Error Occurred:", textStatus, errorThrown);
          console.log("Response from server:", jqXHR.responseText);
          let errorMessage = jqXHR.responseJSON?.error || "An error occurred.";
          console.log("Error Message:", errorMessage);
          showZPaneMessage(errorMessage, false);
        }
      });

    });

// Reset Password button click handler
$("#resetPasswordButton").click(function() {
  let newPassword = $("#newPassword").val();
  let confirmPassword = $("#confirmPassword").val();

  // Check if passwords match
  if (newPassword !== confirmPassword) {
    showZPaneMessage("Passwords do not match.", false);
    return;
  }

  // Disable the button and show loading state
  $("#resetPasswordButton").prop("disabled", true).html('<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Resetting...');

  // Send reset password request via AJAX
  $.ajax({
    url: "http://localhost:8001/reset-password",
    type: "POST",
    contentType: "application/json",
    data: JSON.stringify({ 
      email: $("#resetEmail").val(),
      newPassword: newPassword
    }),
    success: function(data) {
      showZPaneMessage("Password reset successful. You can now log in with your new password.", true);
      
      // Clear the input fields
      $("#resetEmail, #newPassword, #confirmPassword").val("");
      
      // Reset the form view
      $("#resetEmailForm").show();
      $("#resetPasswordForm").hide();
      
      // Close the modal after a short delay
      setTimeout(function() {
        $("#forgotPasswordModal").modal("hide");
      }, 3000);
    },
    error: function(jqXHR, textStatus, errorThrown) {
      console.log("AJAX Error:", textStatus, errorThrown);
      console.log("Response:", jqXHR.responseText);

      let errorMessage = "Error resetting password.";
      if (jqXHR.responseJSON && jqXHR.responseJSON.message) {
        errorMessage = jqXHR.responseJSON.message;
      } else if (jqXHR.status === 0) {
        errorMessage = "Cannot connect to the server. Please check your internet connection and try again.";
      } else if (jqXHR.status) {
        errorMessage = `Server error: ${jqXHR.status} ${jqXHR.statusText}`;
      }

      showZPaneMessage(errorMessage, false);
    },
    complete: function() {
      // Re-enable the button and restore original text
      $("#resetPasswordButton").prop("disabled", false).text("Reset Password");
    }
  });
});
    </script>
  </body>
</html>
