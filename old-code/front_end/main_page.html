<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <title>Bonjour-Sant&eacute; Clone</title>
</head>

<body>
    <nav class="navbar navbar-light bg-light">
        <img src="img/bonjour-sante.inline.svg" id="inline" alt="Bonjour Santé logo" class="img-fluid">
    </nav>

    <header>
        <div class="container-fluid d-flex align-items-center flex-wrap">
            <!-- Hero Image -->
            <div class="col-md-6 col-12 p-0">
                <img src="img/Screenshot 2025-02-20 113850.png" id="booking" alt="medical team of the clinic" class="img-fluid rounded shadow-lg">
            </div>
            <!-- Description -->
            <div class="col-md-6 col-12 mt-3 mt-md-0" id="main-description">
                <div class="h2 mb-3 fw-bold">Find a clinic</div>
                <div class="h3 mb-3">Manage your appointments</div> 
                <div class="h4 mb-4">View your prescriptions and results.</div>
            </div>
        </div>
    </header>
    

    <section class="container text-center mt-5 p-4" id="main-page-container">
        <h5 class="p-1">Book your appointment online</h5>
        <p>Consultations with your medical professional with or without an appointment</p>
        <a href="login.html" class="btn btn-primary">Log In</a>
        <a href="registration.html" class="btn btn-secondary">Register</a>
    </section>

    <!-- Footer -->
    <footer class="mt-5 bg-light py-3 text-center">
        <p>Contact us: info@bonjour-sante.com | +123 456 7890</p>
    </footer>

    <script>
        $(document).ready(function () {
            $("#loginButton").click(function () {
                window.location.href = "http://localhost:8001/login"; 
            });

            $("#registerButton").click(function () {
                window.location.href = "http://localhost:8001/registration"; 
            });
        });
    </script>
</body>
</body>

</html>
