<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Bonjour Santé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">
                <img src="img/bonjour-sante.inline.svg" alt="Bonjour Santé Logo" height="30">
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Forgot Password</h2>
                        <div id="resetEmailForm">
                            <p class="text-muted mb-4">Enter your email address to reset password.</p>
                            <div class="mb-3">
                                <label for="resetEmail" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="resetEmail" placeholder="Enter your email">
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary" type="button" id="sendResetLink">Send Reset Link</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    $(document).ready(function() {
        $("#sendResetLink").click(function() {
            var email = $("#resetEmail").val();
            
            var encodedEmail = encodeURIComponent(email);
            
            $.ajax({
                url: 'http://localhost:8000/api/forgot-password?email=' + encodedEmail,
                type: 'GET',
                success: function(data) {
                    console.log('Success:', data);
                    alert('Password reset instructions sent to your email.');
                },
                error: function(jqXHR, textStatus, errorThrown) {
                    console.error('Error:', jqXHR.responseJSON);
                    alert('An error occurred. Please try again.');
                }
            });
        });
    });
    </script>
</body>
</html>
